<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Event Format Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#F3F4F6}
  svg{display:block}
  text{font-family:'Barlow Condensed',Arial Narrow,sans-serif}
</style>
</head>
<body>
<svg id="art" width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEEF2"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1A1D"/>
      <stop offset="1" stop-color="#0B0B0C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="trackShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#B3150F" flood-opacity="0.25"/>
    </filter>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fff"/>
      <rect width="8" height="8" fill="#111"/>
      <rect x="8" y="8" width="8" height="8" fill="#111"/>
    </pattern>
    <!-- left-pointing arrow -->
    <g id="arrowL">
      <path d="M14 -9 L0 0 L14 9 M0 0 H26" fill="none" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- chevron pointing right (rotate as needed) -->
    <path id="chev" d="M-8 -12 L6 0 L-8 12" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- TRACK -->
  <g filter="url(#trackShadow)">
    <path id="track" d="M190 450 A350 350 0 0 1 890 450 L890 900 A350 350 0 0 1 190 900 Z"
          fill="#FFFFFF" stroke="#E3241B" stroke-width="64"/>
  </g>
  <!-- lane edges + centre dash -->
  <path d="M220 450 A320 320 0 0 1 860 450 L860 900 A320 320 0 0 1 220 900 Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
  <path d="M160 450 A380 380 0 0 1 920 450 L920 900 A380 380 0 0 1 160 900 Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>

  <!-- START line (left straight) -->
  <rect x="158" y="520" width="64" height="10" fill="#fff"/>
  <text x="138" y="478" text-anchor="end" font-size="40" font-weight="800" font-style="italic" fill="#E3241B" letter-spacing="3">START</text>
  <path d="M60 492 C 110 492, 132 500, 140 540" fill="none" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round"/>
  <path d="M128 528 L141 545 L152 525" fill="none" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- direction chevrons: counter-clockwise lap -->
  <use href="#chev" transform="translate(190 600) rotate(90)"/>
  <use href="#chev" transform="translate(190 690) rotate(90)"/>
  <use href="#chev" transform="translate(190 780) rotate(90)"/>
  <use href="#chev" transform="translate(190 870) rotate(90)"/>
  <use href="#chev" transform="translate(237 1075) rotate(60)"/>
  <use href="#chev" transform="translate(843 1075) rotate(-60)"/>
  <use href="#chev" transform="translate(890 870) rotate(-90)"/>
  <use href="#chev" transform="translate(890 780) rotate(-90)"/>
  <use href="#chev" transform="translate(890 600) rotate(-90)"/>
  <use href="#chev" transform="translate(890 510) rotate(-90)"/>
  <use href="#chev" transform="translate(843 275) rotate(-120)"/>
  <use href="#chev" transform="translate(715 147) rotate(-150)"/>
  <use href="#chev" transform="translate(365 147) rotate(150)"/>
  <use href="#chev" transform="translate(237 275) rotate(120)"/>
  <use href="#chev" transform="translate(190 420) rotate(90)"/>
  <path id="bottomArc" d="M190 900 A350 350 0 0 0 890 900" fill="none"/>
  <text font-size="27" font-weight="800" font-style="italic" fill="#fff" letter-spacing="3" dominant-baseline="central">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">600m RUN  »</textPath>
  </text>
  <path id="topArc" d="M190 450 A350 350 0 0 1 890 450" fill="none"/>
  <text font-size="27" font-weight="800" font-style="italic" fill="#fff" letter-spacing="3" dominant-baseline="central">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">«  600m RUN</textPath>
  </text>

  <!-- FINISH (right straight) -->
  <rect x="858" y="686" width="64" height="16" fill="url(#checker)"/>
  <text x="944" y="660" font-size="40" font-weight="800" font-style="italic" fill="#E3241B" letter-spacing="3">FINISH</text>
  <path d="M942 760 C 942 720, 950 690, 990 676" fill="none" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round"/>
  <path d="M975 668 L993 675 L982 692" fill="none" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- TITLE in the top dome -->
  <g>
    <line x1="410" y1="168" x2="452" y2="168" stroke="#E3241B" stroke-width="4"/>
    <line x1="628" y1="168" x2="670" y2="168" stroke="#E3241B" stroke-width="4"/>
    <text x="540" y="180" text-anchor="middle" font-size="34" font-weight="700" fill="#0B0B0C" letter-spacing="8">EVENT</text>
    <text x="540" y="244" text-anchor="middle" font-size="68" font-weight="900" font-style="italic" fill="#0D2A6B" letter-spacing="1">FORMAT</text>
  </g>

  <!-- STATIONS -->
  <g id="stations" font-style="italic"></g>

  <!-- bottom dome info -->
  <text x="540" y="1126" text-anchor="middle" font-size="23" font-weight="800" fill="#0B0B0C" letter-spacing="2">7 RUNS · 6 STATIONS · 4.2KM</text>
  <line x1="480" y1="1146" x2="600" y2="1146" stroke="#E3241B" stroke-width="4"/>
</svg>

<script>
  // Race order: run, station, run, station ... run, finish (13 steps)
  const stations = [
    "BROAD JUMP BURPEES",
    "WALKING LUNGES",
    "GORILLA WALK",
    "SPEED HURDLES",
    "FROG JUMP",
    "BROAD JUMP BURPEES"
  ];
  const RUN = "600m RUN";
  const NS = "http://www.w3.org/2000/svg";
  const g = document.getElementById("stations");
  const mk = (tag, attrs, text) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (text) el.textContent = text;
    return el;
  };
  const CX = 540, BAR_W = 500, BAR_H = 62, RUN_W = 250, RUN_H = 36, GAP = 14;
  let y = 288, step = 1;

  const runRow = (isLast) => {
    const x = CX - RUN_W / 2;
    g.appendChild(mk("rect", {x, y, width: RUN_W, height: RUN_H, rx: RUN_H/2, fill: "#fff", stroke: "#E3241B", "stroke-width": 3}));
    g.appendChild(mk("circle", {cx: x + 20, cy: y + RUN_H/2, r: 14, fill: "#0B0B0C"}));
    g.appendChild(mk("text", {x: x + 20, y: y + RUN_H/2 + 6, "text-anchor": "middle", "font-size": 17, "font-weight": 800, "font-style": "normal", fill: "#fff"}, String(step).padStart(2, "0")));
    g.appendChild(mk("text", {x: x + RUN_W/2 + 16, y: y + RUN_H/2 + 8, "text-anchor": "middle", "font-size": 23, "font-weight": 800, fill: "#E3241B", "letter-spacing": 1}, isLast ? RUN + " » FINISH" : RUN + " »"));
    y += RUN_H + GAP; step++;
  };

  const stationRow = (name, i) => {
    const x = CX - BAR_W / 2;
    g.appendChild(mk("rect", {x, y, width: BAR_W, height: BAR_H, rx: 6, fill: "url(#bar)", filter: "url(#shadow)"}));
    g.appendChild(mk("path", {d: `M${x} ${y+6} Q${x} ${y} ${x+6} ${y} H${x+64} L${x+52} ${y+BAR_H} H${x+6} Q${x} ${y+BAR_H} ${x} ${y+BAR_H-6} Z`, fill: "#E3241B"}));
    g.appendChild(mk("text", {x: x + 30, y: y + 42, "text-anchor": "middle", "font-size": 30, "font-weight": 900, fill: "#fff"}, String(step).padStart(2, "0")));
    g.appendChild(mk("text", {x: x + 72, y: y + 21, "font-size": 14, "font-weight": 800, "font-style": "normal", fill: "#FF5A4F", "letter-spacing": 3}, "EVENT " + (i + 1)));
    g.appendChild(mk("text", {x: x + 72, y: y + 50, "font-size": 30, "font-weight": 800, fill: "#fff", "letter-spacing": 0.5}, name));
    g.appendChild(mk("rect", {x: x + BAR_W - 68, y: y + 15, width: 56, height: 32, rx: 4, fill: "none", stroke: "#E3241B", "stroke-width": 2.5}));
    g.appendChild(mk("text", {x: x + BAR_W - 40, y: y + 40, "text-anchor": "middle", "font-size": 25, "font-weight": 800, fill: "#fff"}, "30M"));
    // enter from the track on the right, exit back to the track on the left
    g.appendChild(mk("use", {href: "#arrowL", transform: `translate(${x + BAR_W + 10} ${y + BAR_H/2})`}));
    g.appendChild(mk("use", {href: "#arrowL", transform: `translate(${x - 40} ${y + BAR_H/2})`}));
    y += BAR_H + GAP; step++;
  };

  stations.forEach((name, i) => { runRow(false); stationRow(name, i); });
  runRow(true);
</script>
</body>
</html>
