<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Event Format Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#F3F4F6}
  svg{display:block}
  text{font-family:'Barlow Condensed',Arial Narrow,sans-serif}
</style>
</head>
<body>
<svg id="art" width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEEF2"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1A1D"/>
      <stop offset="1" stop-color="#0B0B0C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="trackShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#B3150F" flood-opacity="0.25"/>
    </filter>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fff"/>
      <rect width="8" height="8" fill="#111"/>
      <rect x="8" y="8" width="8" height="8" fill="#111"/>
    </pattern>
    <!-- left-pointing arrow -->
    <g id="arrowL">
      <path d="M14 -9 L0 0 L14 9 M0 0 H26" fill="none" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- chevron pointing right (rotate as needed) -->
    <path id="chev" d="M-8 -12 L6 0 L-8 12" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- TRACK -->
  <g filter="url(#trackShadow)">
    <path id="track" d="M190 450 A350 350 0 0 1 890 450 L890 900 A350 350 0 0 1 190 900 Z"
          fill="#FFFFFF" stroke="#E3241B" stroke-width="64"/>
  </g>
  <!-- lane edges + centre dash -->
  <path d="M220 450 A320 320 0 0 1 860 450 L860 900 A320 320 0 0 1 220 900 Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
  <path d="M160 450 A380 380 0 0 1 920 450 L920 900 A380 380 0 0 1 160 900 Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>

  <!-- START line (left straight) -->
  <rect x="158" y="520" width="64" height="10" fill="#fff"/>
  <text x="138" y="478" text-anchor="end" font-size="40" font-weight="800" font-style="italic" fill="#E3241B" letter-spacing="3">START</text>
  <path d="M60 492 C 110 492, 132 500, 140 540" fill="none" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round"/>
  <path d="M128 528 L141 545 L152 525" fill="none" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- direction chevrons: counter-clockwise lap -->
  <use href="#chev" transform="translate(190 640) rotate(90)"/>
  <use href="#chev" transform="translate(190 800) rotate(90)"/>
  <use href="#chev" transform="translate(890 560) rotate(-90)"/>
  <path id="bottomArc" d="M190 900 A350 350 0 0 0 890 900" fill="none"/>
  <text font-size="27" font-weight="800" font-style="italic" fill="#fff" letter-spacing="3" dominant-baseline="central">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">600M RUN = 1.5 LAPS  »</textPath>
  </text>
  <path id="topArc" d="M190 450 A350 350 0 0 1 890 450" fill="none"/>
  <text font-size="27" font-weight="800" font-style="italic" fill="#fff" letter-spacing="3" dominant-baseline="central">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">«  400M TRACK</textPath>
  </text>

  <!-- FINISH (right straight) -->
  <rect x="858" y="686" width="64" height="16" fill="url(#checker)"/>
  <text x="944" y="660" font-size="40" font-weight="800" font-style="italic" fill="#E3241B" letter-spacing="3">FINISH</text>
  <path d="M942 760 C 942 720, 950 690, 990 676" fill="none" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round"/>
  <path d="M975 668 L993 675 L982 692" fill="none" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- TITLE in the top dome -->
  <g>
    <line x1="410" y1="168" x2="452" y2="168" stroke="#E3241B" stroke-width="4"/>
    <line x1="628" y1="168" x2="670" y2="168" stroke="#E3241B" stroke-width="4"/>
    <text x="540" y="180" text-anchor="middle" font-size="34" font-weight="700" fill="#0B0B0C" letter-spacing="8">EVENT</text>
    <text x="540" y="244" text-anchor="middle" font-size="68" font-weight="900" font-style="italic" fill="#0D2A6B" letter-spacing="1">FORMAT</text>
  </g>

  <!-- STATIONS -->
  <g id="stations" font-style="italic"></g>

  <!-- bottom dome info -->
  <text x="540" y="1126" text-anchor="middle" font-size="23" font-weight="800" fill="#0B0B0C" letter-spacing="2">7 × 600M RUN  ·  6 STATIONS</text>
  <line x1="480" y1="1146" x2="600" y2="1146" stroke="#E3241B" stroke-width="4"/>
</svg>

<script>
  // Race order: 600m run (1.5 laps of the 400m track), station, run ... run, finish
  const stations = [
    "BROAD JUMP BURPEES",
    "WALKING LUNGES",
    "GORILLA WALK",
    "SPEED HURDLES",
    "FROG JUMP",
    "BROAD JUMP BURPEES"
  ];
  const NS = "http://www.w3.org/2000/svg";
  const g = document.getElementById("stations");
  const mk = (tag, attrs, text) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (text) el.textContent = text;
    return el;
  };
  const CX = 540, BAR_W = 480, BAR_H = 60, RUN_H = 46, GAP = 10;
  let y = 290;

  const runRow = (label) => {
    g.appendChild(mk("text", {x: CX, y: y + RUN_H/2 + 7, "text-anchor": "middle", "font-size": 21, "font-weight": 700, "font-style": "normal", fill: "#E3241B", "letter-spacing": 3}, label));
    y += RUN_H + GAP;
  };

  const stationRow = (name, i) => {
    const x = CX - BAR_W / 2;
    g.appendChild(mk("rect", {x, y, width: BAR_W, height: BAR_H, rx: 6, fill: "#111113"}));
    g.appendChild(mk("path", {d: `M${x} ${y+6} Q${x} ${y} ${x+6} ${y} H${x+56} L${x+44} ${y+BAR_H} H${x+6} Q${x} ${y+BAR_H} ${x} ${y+BAR_H-6} Z`, fill: "#E3241B"}));
    g.appendChild(mk("text", {x: x + 26, y: y + 42, "text-anchor": "middle", "font-size": 32, "font-weight": 900, fill: "#fff"}, String(i + 1)));
    g.appendChild(mk("text", {x: x + 66, y: y + 41, "font-size": 31, "font-weight": 800, fill: "#fff", "letter-spacing": 0.5}, name));
    g.appendChild(mk("text", {x: x + BAR_W - 16, y: y + 40, "text-anchor": "end", "font-size": 22, "font-weight": 700, "font-style": "normal", fill: "#8A8F98", "letter-spacing": 1}, "30M"));
    // in from the track on the right, out to the track on the left
    g.appendChild(mk("use", {href: "#arrowL", transform: `translate(${x + BAR_W + 12} ${y + BAR_H/2}) scale(.8)`, opacity: .45}));
    g.appendChild(mk("use", {href: "#arrowL", transform: `translate(${x - 36} ${y + BAR_H/2}) scale(.8)`, opacity: .45}));
    y += BAR_H + GAP;
  };

  stations.forEach((name, i) => { runRow(i === 0 ? "START  ›  600M RUN" : "600M RUN"); stationRow(name, i); });
  runRow("600M RUN  ›  FINISH");
</script>
</body>
</html>
