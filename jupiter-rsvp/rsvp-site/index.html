<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1330">
<meta name="robots" content="noindex">
<title>RSVP · The Jupiter Texas Holiday Party</title>
<meta property="og:title" content="The Jupiter Texas Holiday Party">
<meta property="og:description" content="Saturday, December 12 · 6 PM onwards · Plano, TX">
<meta property="og:image" content="og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1330; --navy-2: #121C40; --line: #26305A; --gold: #F2B01E; --gold-2: #FFCB52;
    --ink: #FFFFFF; --muted: #B7BED6; --soft: #8890AE;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--navy); color: var(--ink); }
  body {
    font: 16px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(242,176,30,.16), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(242,176,30,.08), transparent 60%),
      var(--navy);
  }
  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .page { max-width: 520px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 20px 48px; }

  .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; }
  .brand b { color: var(--ink); letter-spacing: .14em; }
  .brand i { font-style: normal; color: var(--gold); }

  .hero { margin: 36px 0 8px; }
  .check { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(242,176,30,.14); border: 1px solid rgba(242,176,30,.4); margin-bottom: 20px; }
  .check svg { width: 26px; height: 26px; stroke: var(--gold); }
  h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.12; letter-spacing: -.01em; margin: 0; }
  h1 em { font-style: normal; color: var(--gold); }
  .lede { color: var(--muted); margin: 14px 0 0; font-size: 17px; }

  .note { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .note svg { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 2px; stroke: var(--gold); }
  .note strong { color: var(--ink); font-weight: 500; }

  .card { margin-top: 24px; background: var(--navy-2); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  .card h2 { margin: 0 0 14px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }

  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .opt { border: 1.5px solid var(--line); background: transparent; color: var(--ink); border-radius: 14px; padding: 14px 12px; font-weight: 500; font-size: 15px; transition: border-color .15s, background .15s, transform .1s; }
  .opt:hover { border-color: #46507A; }
  .opt:active { transform: scale(.97); }
  .opt.on { border-color: var(--gold); background: rgba(242,176,30,.12); color: var(--gold-2); }
  .opt[disabled] { opacity: .6; }
  .saved { min-height: 22px; margin-top: 12px; color: var(--muted); font-size: 14px; }

  .detail { display: flex; gap: 14px; padding: 4px 0; }
  .detail + .detail { margin-top: 14px; }
  .detail svg { flex: 0 0 20px; width: 20px; height: 20px; stroke: var(--gold); margin-top: 3px; }
  .detail .k { font-weight: 500; }
  .detail .v { color: var(--muted); font-size: 14px; }
  .detail a { color: var(--muted); }

  .cal { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; background: rgba(255,255,255,.03); }
  .pill:hover { border-color: #46507A; }
  .pill svg { width: 16px; height: 16px; stroke: var(--gold); }

  .big-btns { display: grid; gap: 10px; margin-top: 24px; }
  .big { border-radius: 999px; padding: 16px; font-weight: 600; font-size: 16px; border: 1.5px solid #46507A; background: transparent; color: var(--ink); transition: transform .1s, background .15s; }
  .big:active { transform: scale(.98); }
  .big.primary { background: var(--gold); border-color: var(--gold); color: var(--navy); }

  .change { margin-top: 28px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 4px; color: var(--soft); font-size: 14px; }
  .change span { width: 100%; text-align: center; }
  .change button { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 4px 6px; }
  .change button.cur { color: var(--soft); text-decoration: none; cursor: default; }

  .poster { width: 100%; border-radius: 16px; display: block; margin-top: 28px; border: 1px solid var(--line); }
  footer { margin-top: 40px; text-align: center; color: var(--soft); font-size: 13px; }
  footer a { color: var(--muted); }

  .spinner { width: 28px; height: 28px; border: 2.5px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 80px auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center { text-align: center; color: var(--muted); }

  .fade { animation: fade .45s ease both; }
  .fade.d1 { animation-delay: .08s; } .fade.d2 { animation-delay: .16s; } .fade.d3 { animation-delay: .24s; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade, .spinner { animation: none; } }
  @media (min-width: 600px) { h1 { font-size: 46px; } .page { padding-top: 56px; } }
</style>
</head>
<body>
<main class="page">
  <div class="brand"><b>Jupiter Texas</b> · <i>Holiday Party</i></div>
  <div id="view"><div class="spinner"></div><p class="center">Saving your response…</p></div>
  <footer>Questions? <a href="mailto:info@jupitertexas.com">info@jupitertexas.com</a> · <a href="https://jupitertexas.com">jupitertexas.com</a></footer>
</main>

<script src="config.js"></script>
<script>
(function () {
  var EVENT = {
    title: 'The Jupiter Texas Holiday Party',
    date: 'Saturday, December 12',
    time: '6 PM onwards',
    venue: 'Elegance Ballroom & Event Center (Hello India)',
    address: '8740 Ohio Dr A1, Plano, TX 75024',
    map: 'https://maps.google.com/?q=8740+Ohio+Dr+A1,+Plano,+TX+75024',
    gcal: 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent('The Jupiter Texas Holiday Party') +
      '&dates=20261213T000000Z/20261213T050000Z' +
      '&location=' + encodeURIComponent('Elegance Ballroom & Event Center (Hello India), 8740 Ohio Dr A1, Plano, TX 75024') +
      '&details=' + encodeURIComponent('Jupiter Texas Real Estate Group invites you and your family. Questions? info@jupitertexas.com'),
    ics: 'jupiter-holiday-party.ics'
  };
  var PARTY = [['1', 'Just me'], ['2', 'Me +1'], ['3', 'Me +2'], ['4+', 'Me +3 or more']];

  var params = new URLSearchParams(location.search);
  var token = params.get('t');
  var action = (params.get('a') || '').toLowerCase();
  var view = document.getElementById('view');
  var state = null;

  var ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>'
  };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function api(params) {
    var url = window.RSVP_API_URL + '?' + new URLSearchParams(params).toString();
    return fetch(url, { method: 'GET', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (!d.ok) throw new Error(d.error || 'Something went wrong.'); return d; });
  }

  function retry(fn, tries) {
    return fn().catch(function (err) {
      if (tries <= 1) throw err;
      return new Promise(function (r) { setTimeout(r, 1200); }).then(function () { return retry(fn, tries - 1); });
    });
  }

  function detailsCard(showCal) {
    return '<section class="card fade d2"><h2>The evening</h2>' +
      '<div class="detail">' + ICON.clock + '<div><div class="k">' + EVENT.date + '</div><div class="v">' + EVENT.time + '</div></div></div>' +
      '<div class="detail">' + ICON.pin + '<div><div class="k">' + EVENT.venue + '</div><div class="v"><a href="' + EVENT.map + '" target="_blank" rel="noopener">' + EVENT.address + '</a></div></div></div>' +
      (showCal ? '<div class="cal"><a class="pill" href="' + EVENT.ics + '">' + ICON.cal + ' Apple / Outlook</a>' +
                 '<a class="pill" href="' + EVENT.gcal + '" target="_blank" rel="noopener">' + ICON.cal + ' Google Calendar</a></div>' : '') +
      '</section>';
  }

  function calendarNote(s) {
    var to = '<strong>' + esc(s.email) + '</strong>';
    var text = {
      sent: 'A calendar invite is on its way to ' + to + '. It will appear in your calendar in a moment.',
      existing: 'It\'s already in your calendar. We\'ll send you a reminder before the day.',
      failed: 'Add it to your calendar with one tap below.',
      removed: 'We\'ve taken it off your calendar.'
    }[s.calendar];
    if (!text) return '';
    return '<div class="note fade d1">' + ICON.cal + '<div>' + text + '</div></div>';
  }

  function changeRow(current) {
    var opts = [['yes', 'Attending'], ['maybe', 'Maybe'], ['no', 'Can\'t make it']];
    return '<div class="change fade d3"><span>Change your answer</span>' + opts.map(function (o) {
      var cur = o[0] === current;
      return '<button ' + (cur ? 'class="cur" disabled' : 'data-rsvp="' + o[0] + '"') + '>' + o[1] + '</button>';
    }).join('') + '</div>';
  }

  function render() {
    var s = state, html = '';
    var name = esc(s.firstName);
    if (s.rsvp === 'Yes') {
      html =
        '<section class="hero fade"><div class="check">' + ICON.check + '</div>' +
        '<h1>You\'re in, <em>' + name + '</em>.</h1>' +
        '<p class="lede">We can\'t wait to celebrate with you and your family.</p>' + calendarNote(s) + '</section>' +
        '<section class="card fade d1"><h2>How many in your party?</h2><div class="options">' +
          PARTY.map(function (p) { return '<button class="opt' + (s.partySize === p[0] ? ' on' : '') + '" data-party="' + p[0] + '">' + p[1] + '</button>'; }).join('') +
        '</div><div class="saved" id="saved">' + partyLine(s.partySize) + '</div></section>' +
        detailsCard(true) + changeRow('yes');
    } else if (s.rsvp === 'Maybe') {
      html =
        '<section class="hero fade"><div class="check">' + ICON.cal + '</div>' +
        '<h1>We\'ve pencilled you in, <em>' + name + '</em>.</h1>' +
        '<p class="lede">So the date doesn\'t slip away. Confirm whenever you know.</p>' + calendarNote(s) + '</section>' +
        '<section class="card fade d1"><h2>What\'s holding you back?</h2><div class="options">' +
          s.reasons.map(function (r) { return '<button class="opt' + (s.reason === r ? ' on' : '') + '" data-reason="' + esc(r) + '">' + esc(r) + '</button>'; }).join('') +
        '</div><div class="saved" id="saved">' + (s.reason ? 'Thanks. We\'ll check in closer to the date.' : '') + '</div></section>' +
        detailsCard(true) + changeRow('maybe');
    } else if (s.rsvp === 'No') {
      html =
        '<section class="hero fade"><div class="check">' + ICON.heart + '</div>' +
        '<h1>We\'ll miss you, <em>' + name + '</em>.</h1>' +
        '<p class="lede">Thank you for letting us know. If plans change, you can update your answer here any time.</p>' + calendarNote(s) + '</section>' +
        '<div class="big-btns fade d1"><button class="big primary" data-rsvp="yes">Actually, I can make it</button><button class="big" data-rsvp="maybe">I might make it</button></div>';
    } else {
      html =
        '<section class="hero fade"><h1>Will you join us, <em>' + name + '</em>?</h1>' +
        '<p class="lede">Jupiter Texas invites you and your family to the Holiday Party. Bring your friends along.</p></section>' +
        '<div class="big-btns fade d1"><button class="big primary" data-rsvp="yes">Yes, I\'ll be there</button>' +
        '<button class="big" data-rsvp="maybe">Maybe</button><button class="big" data-rsvp="no">Can\'t make it</button></div>' +
        detailsCard(false);
    }
    view.innerHTML = html;
  }

  function partyLine(size) {
    if (!size) return '';
    var label = { '1': 'just you', '2': '2 people', '3': '3 people', '4+': '4 or more' }[size];
    return 'Perfect. We\'re planning for ' + label + '. Tap to change.';
  }

  function showError(message) {
    view.innerHTML = '<section class="hero fade"><h1>We couldn\'t <em>save that</em>.</h1>' +
      '<p class="lede">' + esc(message) + '</p></section>' +
      '<div class="big-btns fade d1"><button class="big primary" id="again">Try again</button>' +
      '<a class="big" style="text-align:center;text-decoration:none" href="mailto:info@jupitertexas.com?subject=Holiday%20Party%20RSVP">Reply by email instead</a></div>';
    document.getElementById('again').onclick = function () { location.reload(); };
  }

  function showPoster() {
    view.innerHTML = '<section class="hero fade"><h1>The <em>Holiday Party</em></h1>' +
      '<p class="lede">Please use the RSVP buttons in your invitation email.</p></section>' +
      '<img class="poster fade d1" src="poster.jpg" alt="The Jupiter Texas Holiday Party, Saturday December 12, 6 PM onwards, Plano TX">' + detailsCard(true);
  }

  function setRsvp(choice) {
    view.innerHTML = '<div class="spinner"></div><p class="center">Updating…</p>';
    retry(function () { return api({ api: 'rsvp', t: token, a: choice }); }, 3).then(function (d) {
      state = d;
      history.replaceState(null, '', '?t=' + encodeURIComponent(token) + '&a=' + choice);
      render();
      window.scrollTo(0, 0);
    }).catch(function (e) { showError(e.message); });
  }

  view.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || btn.disabled) return;
    if (btn.dataset.rsvp) return setRsvp(btn.dataset.rsvp);
    var saved = document.getElementById('saved');
    if (btn.dataset.party || btn.dataset.reason) {
      var siblings = btn.parentNode.querySelectorAll('.opt');
      siblings.forEach(function (b) { b.classList.toggle('on', b === btn); });
      saved.textContent = 'Saving…';
      var req = btn.dataset.party ? { api: 'party', t: token, n: btn.dataset.party } : { api: 'reason', t: token, r: btn.dataset.reason };
      retry(function () { return api(req); }, 3).then(function (d) {
        state.partySize = d.partySize; state.reason = d.reason;
        saved.textContent = btn.dataset.party ? partyLine(d.partySize) : 'Thanks. We\'ll check in closer to the date.';
      }).catch(function () { saved.textContent = 'Couldn\'t save that. Tap again.'; btn.classList.remove('on'); });
    }
  });

  if (!token) return showPoster();
  var first = ['yes', 'maybe', 'no'].indexOf(action) !== -1
    ? function () { return api({ api: 'rsvp', t: token, a: action }); }
    : function () { return api({ api: 'get', t: token }); };
  // Email security scanners open links in hidden browsers. Only record once a person is actually looking.
  function whenVisible(fn) {
    if (!document.hidden) return setTimeout(fn, 250);
    document.addEventListener('visibilitychange', function once() {
      if (document.hidden) return;
      document.removeEventListener('visibilitychange', once);
      setTimeout(fn, 250);
    });
  }
  whenVisible(function () {
    retry(first, 3).then(function (d) { state = d; render(); }).catch(function (e) { showError(e.message); });
  });
})();
</script>
</body>
</html>
